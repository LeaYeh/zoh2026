run_name: chronos_lora_v1

dataset:
  name: competition         # fill after briefing
  prediction_length: 30     # fill after briefing

model:
  name: chronos
  checkpoint: amazon/chronos-t5-small
  context_length: 512       # adjust after EDA
  prediction_length: 30     # fill after briefing
  num_samples: 20
  finetune:
    method: lora
    lora_r: 8
    lora_alpha: 32
    lora_dropout: 0.1
    target_modules: [q, v]  # conservative: attention query + value only

training:
  max_steps: 1000
  batch_size: 32            # A100; use 4 on CPU
  learning_rate: 1.0e-4
  early_stop_patience: 3    # stop if val CRPS doesn't improve for 3 evals
  eval_every: 100           # eval val CRPS every N steps
  precision: bf16-mixed     # A100 only; remove on CPU

  experience_replay:
    enabled: true
    ratio: 0.3              # 30% of each batch from financial replay
    start: "2015-01-01"     # extended: covers 2017 crypto bull + 2015 China correction
    end: "2025-06-01"
    symbols:
      # ── US equity indices ──────────────────────────────────
      - "^GSPC"             # S&P 500
      - "^IXIC"             # NASDAQ
      - "^DJI"              # Dow Jones
      - "^FTSE"             # FTSE 100
      - "^N225"             # Nikkei 225
      # ── Volatility / bear-market regime ───────────────────
      - "^VIX"              # fear index — spikes 2018/2020/2022
      - "SQQQ"              # 3× inverse NASDAQ — captures crash dynamics
      - "SH"                # 1× inverse S&P
      # ── Equity ETFs (extra regime diversity) ──────────────
      - "QQQ"               # NASDAQ-100 ETF
      - "SPY"               # S&P 500 ETF
      - "IWM"               # Russell 2000 small-cap
      # ── Tech stocks ───────────────────────────────────────
      - "AAPL"
      - "MSFT"
      - "GOOGL"
      - "NVDA"
      - "BABA"              # China tech — different regime cycle
      - "TSM"               # semiconductor cycle
      # ── Commodities ───────────────────────────────────────
      - "GC=F"              # Gold futures
      - "CL=F"              # Crude oil futures
      - "TLT"               # 20yr US treasury ETF
      - "GLD"               # Gold ETF (more history than GC=F)
      # ── Crypto — covers 2017 AND 2021 bull markets ────────
      - "BTC-USD"           # 2015+: $200→$20k(2017)→$69k(2021)→$16k(2022)
      - "ETH-USD"           # 2015+: full cycle
      - "LTC-USD"           # 2015+: 2017 bull anchor
      - "XRP-USD"           # 2017+: 2017 peak $3.84
      - "ADA-USD"           # 2017+: alt bull
      - "DOGE-USD"          # 2017+: meme/extreme volatility
      - "LINK-USD"          # 2017+: DeFi cycle
      # ── Forex ─────────────────────────────────────────────
      - "EURUSD=X"          # EUR/USD
      - "JPY=X"             # USD/JPY — risk-off indicator
      - "GBPUSD=X"          # GBP/USD — Brexit volatility 2016/2019
