run_name: local_ablation_B_desc

model:
  type: gpt2_scratch
  max_seq_len: 256
  n_embd: 256
  n_layer: 6
  n_head: 8
  embedding_init: description
  desc_path: data/processed/parameters_parsed.json

dataset:
  name: process_csv
  train_path: data/raw/training_data/
  train_files:
    - IC_variants.csv
    - IGBT_variants.csv
    - MOSFET_variants.csv
  sequence_col: SEQUENCE_ID
  step_col: STEP
  val_ratio: 0.1
  min_length: 10
  seed: 42
  family_prefix: true

training:
  steps: 300
  batch_size: 32
  lr: 5.0e-4
  warmup_steps: 30
  grad_clip: 1.0
  eval_every: 100
  log_every: 50
