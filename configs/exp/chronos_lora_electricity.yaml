run_name: chronos_lora_electricity

dataset:
  name: electricity

model:
  name: chronos
  checkpoint: amazon/chronos-t5-small
  context_length: 512
  prediction_length: 24
  num_samples: 20
  finetune:
    method: lora
    lora_r: 8
    lora_alpha: 32
    lora_dropout: 0.1
    target_modules: [q, v]

training:
  max_steps: 200
  batch_size: 4
  learning_rate: 5.0e-5
