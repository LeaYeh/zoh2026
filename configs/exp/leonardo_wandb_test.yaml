run_name: leonardo_wandb_test

model:
  type: gpt2_scratch
  max_seq_len: 64
  n_embd: 64
  n_layer: 2
  n_head: 2

dataset:
  name: dummy
  n_series: 200
  val_ratio: 0.1
  seed: 42

training:
  steps: 100
  batch_size: 16
  lr: 1.0e-3
  warmup_steps: 10
  grad_clip: 1.0
  eval_every: 50
  log_every: 5
