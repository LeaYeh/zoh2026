run_name: chronos_lora_dummy

dataset:
  name: dummy
  n_series: 20
  length: 256
  prediction_length: 24

model:
  name: chronos
  checkpoint: amazon/chronos-t5-small
  context_length: 128
  prediction_length: 24
  num_samples: 20
  finetune:
    method: lora
    lora_r: 8
    lora_alpha: 32
    lora_dropout: 0.1

training:
  max_steps: 100
  batch_size: 4
  learning_rate: 1.0e-4
