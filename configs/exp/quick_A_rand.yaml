run_name: quick_A_rand

model:
  type: gpt2_scratch
  max_seq_len: 200
  n_embd: 128
  n_layer: 2
  n_head: 4

dataset:
  name: process_csv
  train_path: data/raw/training_data/
  train_files:
    - IC_variants.csv
    - IGBT_variants.csv
    - MOSFET_variants.csv
  sequence_col: SEQUENCE_ID
  step_col: STEP
  val_ratio: 0.1
  min_length: 10
  seed: 42
  family_prefix: true

training:
  steps: 200
  batch_size: 32
  lr: 5.0e-4
  warmup_steps: 20
  grad_clip: 1.0
  eval_every: 100
  log_every: 50
