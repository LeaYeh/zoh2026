competition:
  name: "Zero One Hack Vienna 2026"
  track: 1
  partner: "Infineon"
  metric: "top1_accuracy"         # primary eval metric (Task 1 Top-1)
  seed: 42

data:
  train_path: "data/raw/training_data/"
  product_families: [IC, IGBT, MOSFET]
  eval_valid_csv: "data/raw/eval_input_valid.csv"
  eval_anomaly_csv: "data/raw/eval_input_anomaly.csv"
  sequence_col: "SEQUENCE_ID"
  step_col: "STEP"
  min_length: 10

model:
  type: gpt2_scratch
  max_seq_len: 256
  n_embd: 256
  n_layer: 6
  n_head: 8

evaluation:
  top_k: [1, 3, 5]               # Task 1: next-step prediction
  truncation_levels: [0.6, 0.8]  # Task 2: sequence completion
  anomaly_threshold: null        # Task 3: null = median of scores
