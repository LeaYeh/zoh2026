[project]
name = "ai-competition"
version = "0.1.0"
description = "Zero One Hack Vienna 2026 — Track 03: Trading Decision Agent"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    # Forecasting + training
    "chronos-forecasting>=1.3",
    "transformers>=4.41",
    "accelerate>=0.30",
    "lightning>=2.2",
    "peft>=0.11",
    "gluonts>=0.15",
    "orjson>=3.10",
    # Agent
    "langgraph>=0.1",
    "anthropic>=0.28",
    "langchain-anthropic>=0.1",
    # Data
    "yfinance>=0.2",
    "pyarrow>=16.0",
    # Experiment tracking
    "wandb>=0.17",
    # Demo
    "gradio>=4.36",
    # Utils
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
    "kaggle>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
